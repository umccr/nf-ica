name: Deploy Pipeline to ICA

on:
  push:
    tags:
      - "*/*__*"  # Matches: <workflow-name>/<version-tag>__<timestamp>

permissions:
  contents: write        # Create GitHub Releases, commit ica_pipelines.yaml updates
  id-token: write        # OIDC token for AWS role assumption (ICA auth)
  packages: read         # Pull nf-ica-cli container image from GHCR

env:
  CLI_IMAGE: ghcr.io/umccr/nf-ica-cli:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed to read annotated tag messages
      # actions/checkout can leave the local tag ref pointing at the peeled
      # commit rather than the annotated tag object, which makes
      # `git tag -l --format=%(contents)` return nothing. Force-fetch the tag
      # ref from the remote so it resolves to the annotated tag object (whose
      # message carries the deployment metadata the CLI decodes).
      - name: Restore annotated tag object
        run: |
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          echo "=== tag object type (expect: tag) ==="
          git cat-file -t "${GITHUB_REF_NAME}"
      # Get tag name
      - name: Parse tag name
        id: tag
        run: |
          # Tag ref: refs/tags/oncoanalyser/2.2.0__20250715143022
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          # Extract workflow name (everything before the first /)
          WORKFLOW_NAME="${TAG_NAME%%/*}"
          echo "workflow_name=${WORKFLOW_NAME}" >> "$GITHUB_OUTPUT"

          # Extract version tag (between / and __)
          VERSION_WITH_TS="${TAG_NAME#*/}"
          VERSION_TAG="${VERSION_WITH_TS%%__*}"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

          echo "::notice::Deploying workflow=${WORKFLOW_NAME} version=${VERSION_TAG} tag=${TAG_NAME}"
      # TEMP: decode the OIDC token claims the CLI will present to STS, so we
      # can see the actual sub/aud and compare against the role trust policy.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "=== decoded JWT claims (payload only) ==="
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); print(json.dumps(json.loads(base64.b64decode(s)), indent=2))" \
            | grep -E '"(sub|aud|repository|ref|workflow_ref|iss)"'
      # Log into docker registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deploy to ICA
      - name: Deploy workflow to ICA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ACTIONS_ID_TOKEN_REQUEST_TOKEN and ACTIONS_ID_TOKEN_REQUEST_URL are
          # injected into the runner environment by GitHub when id-token: write
          # is granted. They are forwarded into the container via `-e` below
          # (no value), not through the ${{ }} context where they aren't available.
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e NF_ICA_REPO_PATH=/workspace \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ${{ env.CLI_IMAGE }} \
            gh-actions-deploy-workflow \
              --workflow-name="${{ steps.tag.outputs.workflow_name }}" \
              --workflow-version="${{ steps.tag.outputs.version_tag }}" \
              --annotated-tag-name="${{ steps.tag.outputs.tag_name }}"
      # Commit pipelines.yaml file
      - name: Commit updated ica_pipelines.yaml
        if: success()
        run: |
          if git diff --quiet config/ica_pipelines.yaml 2>/dev/null; then
            echo "No changes to ica_pipelines.yaml"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ica_pipelines.yaml
          git commit -m "chore: update ica_pipelines.yaml after deploying ${{ steps.tag.outputs.workflow_name }}/${{ steps.tag.outputs.version_tag }}"
          git push origin HEAD:main
